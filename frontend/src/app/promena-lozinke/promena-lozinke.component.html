<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants</title>
    <!-- Bootstrap CSS -->
</head>
<body>
<header>
    <!-- Header content: You can add a logo, navigation bar, etc. -->
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand">Restaurant App</a>
        </div>
    </nav>
</header>

<main>

<div class="container">
  <nav class="navbar navbar-expand-lg navbar-custom">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
    <div class = "poravnanje">
    <a (click)="logout()" class="navbar-brand">Izloguj se</a>
    <a routerLink="/profil" class="navbar-brand">Profil</a>
    <a routerLink="/promenaLozinke" routerLinkActive="active"  class="navbar-brand">Promena lozinke</a>
    <a *ngIf="user.tip == 'gost'" routerLink="/restorani" class="navbar-brand">Restorani</a>
    <a *ngIf="user.tip == 'gost'" routerLink="/rezervacije" class="navbar-brand">Rezervacije</a>
    <a *ngIf="user.tip == 'gost'" routerLink="/dostavaHrane" class="navbar-brand">Dostava Hrane</a>
    <a *ngIf="user.tip == 'konobar'" routerLink="/rezervacijeKonobar" class="navbar-brand">Rezervacije</a>
    <a *ngIf="user.tip == 'konobar'" routerLink="/dostave" class="navbar-brand">Dostave</a>
    <a *ngIf="user.tip == 'konobar'" routerLink="/statistika" class="navbar-brand">Statistika</a>
    <a *ngIf="user.tip == 'admin'" routerLink="/zahtevi" class="navbar-brand">Zahtevi</a>
    <a *ngIf="user.tip == 'admin'" routerLink="/dodajKonobara" class="navbar-brand">Dodaj konobara</a>
    <a *ngIf="user.tip == 'admin'" routerLink="/dodajRestoran" class="navbar-brand">Dodaj restoran</a>
    <a *ngIf="user.tip == 'admin'" routerLink="/restoraniRadnoVreme" class="navbar-brand">Radno vreme</a>
    </div>
  </div>
</nav>
<div class="center">
    <input type="password" placeholder="stara lozinka" [(ngModel)]="oldPassword"><br/>
    <input type="password"  placeholder="nova lozinka" [(ngModel)]="newPassword"><br/>
    <input type="password" placeholder="ponovljena nova lozinka" [(ngModel)]="confirmPassword"><br/>
    <button (click)="changeP()">Promeni lozinku</button>
  </div>
</div>
</main>

<footer class="text-center text-lg-start bg-light text-muted">
    <div class="text-center p-4" style="background-color: rgba(0, 0, 0, 0.05);">
        © 2024 Restaurant App
    </div>
</footer>
</body>
</html>
