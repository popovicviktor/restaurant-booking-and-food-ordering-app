<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants</title>
    <!-- Bootstrap CSS -->
</head>
<body>
<header>
    <!-- Header content: You can add a logo, navigation bar, etc. -->
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand">Restaurant App</a>
        </div>
    </nav>
</header>

<main>
    <div class="container">
    <nav class="navbar navbar-expand-lg navbar-custom">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="poravnanje">
          <a routerLink="/" class="navbar-brand">Početak</a>
          <a routerLink="/login" class="navbar-brand">Uloguj se</a>
          <a routerLink="/register" routerLinkActive="active" class="navbar-brand">Registruj se</a>
        </div>
      </div>
    </nav>
    <div>
    <div class="center">
    Korisničko ime: <input type="text" [(ngModel)]="user.korisnicko_ime"><br/>
    Lozinka: <input type="password" [(ngModel)]="user.lozinka"><br/>
    Bezbednosno pitanje: <input type="textbox" [(ngModel)]="user.pitanje"><br/>
    Odgovor: <input type="textbox" [(ngModel)]="user.odgovor"><br/>
    Ime: <input type="text" [(ngModel)]="user.ime"><br/>
    Prezime: <input type="text" [(ngModel)]="user.prezime"><br/>
    Pol:<br>
    <table>
      <tr>
        <td>Muški:</td>
        <td></td>
        <td></td>
        <td><input type = "radio" [(ngModel)]="user.pol" value="M"></td>
      </tr>
      <tr>
        <td>Ženski:</td>
        <td></td>
        <td></td>
        <td><input type = "radio" [(ngModel)]="user.pol" value="F"></td>
      </tr>
    </table><br>
    Adresa: <input type="text" [(ngModel)]="user.adresa"><br/>
    Kontakt telefon: <input type="text" [(ngModel)]="user.telefon"><br/>
    E-mail: <input type="text" [(ngModel)]="user.mejl"><br/>
    Fotografija: <input type="file" accept="image/*" (change)="onFileSelected($event)"><br/>
    Broj platne kartice: <input type="text" [(ngModel)]="user.broj_kartice"><br/>
    <button (click)="register()">Registruj se</button>
  </div>
  </div>
  </div>
</main>

<footer class="text-center text-lg-start bg-light text-muted">
    <div class="text-center p-4" style="background-color: rgba(0, 0, 0, 0.05);">
        © 2024 Restaurant App
    </div>
</footer>
</body>
</html>
