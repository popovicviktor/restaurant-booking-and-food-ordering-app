<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants</title>
    <!-- Bootstrap CSS -->
</head>
<body>
<header>
    <!-- Header content: You can add a logo, navigation bar, etc. -->
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand">Restaurant App</a>
        </div>
    </nav>
</header>

<main>
    <div class="container">
    <nav class="navbar navbar-expand-lg navbar-custom">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <div class="poravnanje">
          <a (click)="logout()" class="navbar-brand">Izloguj se</a>
          <a routerLink="/profil" class="navbar-brand">Profil</a>
          <a routerLink="/promenaLozinke" class="navbar-brand">Promena lozinke</a>
          <a routerLink="/rezervacijeKonobar" class="navbar-brand">Rezervacije</a>
          <a routerLink="/dostave" class="navbar-brand">Dostave</a>
          <a routerLink="/statistika" routerLinkActive="active" class="navbar-brand">Statistika</a>

        </div>
      </div>
    </nav>
    <div>
    <div class="center">
      <div class = "centrirano">
      <h2>{{user.korisnicko_ime}}: Broj gostiju po danima:</h2>
        <canvas id="myChart"></canvas><br>
        <h2>{{user.korisnicko_ime}}: broj rezervacija po danu u poslednja 24 meseca(%):</h2>
        <canvas id="myChart1"></canvas>
        <h2>Raspodela gostiju po konobarima:</h2>
        <canvas id="myPieChart"></canvas>
      </div>
    </div>
    </div>
    </div>
</main>

<footer class="text-center text-lg-start bg-light text-muted">
    <div class="text-center p-4" style="background-color: rgba(0, 0, 0, 0.05);">
        © 2024 Restaurant App
    </div>
</footer>
</body>
</html>
